<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 帮佣配对问卷</title>
<style>
/* One column, thumb-first: wine masthead, one question at a time, then a household report. */
:root {
  color-scheme: light;
  --wine: #6e1423;
  --wine-deep: #4f0d19;
  --ink: #26171b;
  --muted: #6d5a60;
  --line: #e5d8dc;
  --paper: #f8f4f5;
  --card: #ffffff;
  --blush: #f6e9ec;
  --whatsapp: #128c4a;
  --ok: #2f7a45;
  --warn: #b5651d;
  --heavy: #b3261e;
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.6; }
.top { background: var(--wine); color: #fff; padding: 20px 20px 24px; }
.wrap { max-width: 520px; margin: 0 auto; }
.brand { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 14px; }
.brand b { font-size: 17px; letter-spacing: .02em; }
.brand span { color: #f0d5db; }
.top h1 { margin: 14px 0 4px; font-size: 25px; line-height: 1.3; text-wrap: balance; }
.top p { margin: 0; color: #f6e3e7; font-size: 15px; }
main { padding: 20px 16px 36px; }
.meta { display: flex; justify-content: space-between; align-items: center; min-height: 36px; font-size: 14px; color: var(--muted); }
.back { background: none; border: 0; color: var(--wine); font: inherit; font-weight: 600; padding: 6px 8px 6px 0; cursor: pointer; }
.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin: 4px 0 18px; }
.bar i { display: block; height: 100%; background: var(--wine); transition: width .2s ease; }
h2 { font-size: 21px; line-height: 1.4; margin: 0 0 4px; text-wrap: balance; outline: none; }
.hint { margin: 0; color: var(--muted); font-size: 15px; }
.opts { display: grid; gap: 10px; margin-top: 16px; }
.opt { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; min-height: 58px; padding: 12px 16px; text-align: left; font: inherit; color: var(--ink); background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; cursor: pointer; }
.opt::after { content: "›"; color: var(--wine); font-size: 22px; line-height: 1; }
.opt:hover { border-color: var(--wine); }
.opt:active { background: var(--blush); border-color: var(--wine); }
.opt small { display: block; color: var(--muted); font-size: 14px; line-height: 1.4; }
button:focus-visible, a:focus-visible, textarea:focus-visible { outline: 3px solid #c9788a; outline-offset: 2px; }

/* report */
.badge { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px 18px; text-align: center; }
.badge .ring { width: 92px; height: 92px; margin: 0 auto 10px; border-radius: 50%; background: var(--wine); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 34px; box-shadow: 0 0 0 5px var(--blush); }
.badge small { color: var(--muted); font-size: 13px; letter-spacing: .05em; }
.badge h2 { font-size: 24px; color: var(--wine); margin: 2px 0 6px; }
.badge p { margin: 0; color: var(--ink); font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 12px 0 0; padding: 0; list-style: none; }
.chips li { background: var(--blush); color: var(--wine-deep); border-radius: 6px; padding: 2px 9px; font-size: 13px; }
.sec { margin-top: 18px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.sec h3 { margin: 0 0 2px; font-size: 17px; color: var(--wine); display: flex; gap: 8px; align-items: baseline; }
.sec h3 span { color: var(--muted); font-size: 13px; font-weight: 600; }
.sec > p.lead { margin: 0 0 10px; color: var(--muted); font-size: 14px; }
.radar { display: block; width: 100%; max-width: 320px; margin: 4px auto 0; }
.radar text { font-size: 12px; fill: var(--ink); font-family: var(--font); }
.radar .grid { fill: none; stroke: var(--line); }
.radar .area { fill: rgba(110,20,35,.18); stroke: var(--wine); stroke-width: 2; }
.radar .dot { fill: var(--wine); }
.top3 { margin: 8px 0 0; font-size: 15px; text-align: center; }
.day { list-style: none; margin: 0; padding: 0; position: relative; }
.day li { display: grid; grid-template-columns: 52px 1fr; gap: 10px; padding: 6px 0; font-size: 15px; position: relative; }
.day li b { font-variant-numeric: tabular-nums; color: var(--wine); font-weight: 700; }
.day li.rest span { color: var(--ok); font-weight: 600; }
.ins { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.ins li { display: grid; grid-template-columns: 28px 1fr; gap: 8px; font-size: 15px; }
.ins li i { font-style: normal; font-size: 20px; line-height: 1.3; }
.ins li b { display: block; }
.ins li span { color: var(--muted); font-size: 14px; }
.traits { display: grid; gap: 8px; margin: 6px 0 12px; }
.traits div { background: var(--blush); border-radius: 8px; padding: 8px 12px; font-weight: 600; color: var(--wine-deep); font-size: 15px; }
.qs { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 15px; }
.qtitle { margin: 4px 0 6px; font-weight: 700; font-size: 15px; }
.meter { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; margin: 8px 0 6px; }
.meter i { display: block; height: 100%; border-radius: 5px; }
.load { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.verdict { font-weight: 700; font-size: 18px; margin: 6px 0 4px; }
.sec p { margin: 0; font-size: 15px; }
.extra { display: block; margin-top: 22px; font-weight: 700; color: var(--wine); }
textarea { display: block; width: 100%; min-height: 84px; margin-top: 8px; padding: 10px 12px; font: inherit; color: var(--ink); background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; resize: vertical; }
.cta { display: block; margin-top: 16px; padding: 15px 16px; text-align: center; font-weight: 700; color: #fff; background: var(--whatsapp); border-radius: 10px; text-decoration: none; }
.sub { margin: 8px 0 0; text-align: center; font-size: 14px; color: var(--muted); }
.again { display: block; width: 100%; margin-top: 12px; padding: 12px; font: inherit; color: var(--wine); font-weight: 600; background: none; border: 1.5px solid var(--line); border-radius: 10px; cursor: pointer; }
.note { margin: 18px 0 0; font-size: 13px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>
<!-- Meta Pixel:把下面的 PIXEL_ID 换成你在 Facebook 事件管理工具里的像素编号 -->
<script>
var PIXEL_ID = ""; // 例如 "1234567890123456"
if (PIXEL_ID) {
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
  n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
  document,'script','https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', PIXEL_ID);
  fbq('track', 'PageView');
}
function track(name, params) { try { if (window.fbq) fbq('track', name, params || {}); } catch (e) {} }
</script>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><b>Maju One</b><span>自 2000 年</span></div>
    <h1 id="headline">不看八字,看你家的需要</h1>
    <p id="subline">点选 6 题,马上看到你家的 AI 帮佣报告。</p>
  </div>
</header>
<main class="wrap" id="app" aria-live="polite"></main>

<script>
var WHATSAPP = "60189891966";
var TOTAL = 6;

var START = { id: "need", q: "您最需要帮佣做什么?", opts: [
  { v: "elderly", t: "照顾长辈" },
  { v: "child", t: "照顾小孩" },
  { v: "house", t: "家务为主", s: "打扫、洗烫、煮饭" }
]};

var FLOWS = {
  elderly: [
    { id: "mob", q: "长辈的行动情况比较接近哪一种?", opts: [
      { v: "A", t: "可以自己走动", s: "主要需要陪伴和日常协助", chip: "长辈能自己走动" },
      { v: "B", t: "需要搀扶,或用助行器、轮椅", chip: "长辈需要搀扶或轮椅" },
      { v: "C", t: "大部分时间卧床", chip: "长辈大部分时间卧床" }
    ]},
    { id: "health", q: "长辈有以下情况吗?", opts: [
      { v: "none", t: "没有特别情况", chip: "没有特别健康情况" },
      { v: "meds", t: "慢性病,需要按时吃药", chip: "需要按时吃药" },
      { v: "memory", t: "记忆退化或失智", chip: "记忆退化" },
      { v: "medical", t: "需要打针、插管等医疗护理", chip: "需要医疗护理" }
    ]}
  ],
  child: [
    { id: "age", q: "要照顾的小孩多大?", hint: "有几个小孩的话,选最小的一位。", opts: [
      { v: "baby", t: "1 岁以下", chip: "小孩 1 岁以下" },
      { v: "small", t: "1 至 6 岁", chip: "小孩 1 至 6 岁" },
      { v: "school", t: "7 岁以上", chip: "小孩 7 岁以上" }
    ]},
    { id: "adult", q: "白天家里有大人吗?", opts: [
      { v: "always", t: "有,一直有人", chip: "白天有大人在家" },
      { v: "some", t: "有时有", chip: "白天有时有大人" },
      { v: "none", t: "没有,大人都上班", chip: "白天没有大人" }
    ]}
  ],
  house: [
    { id: "size", q: "您住哪一种房子?", opts: [
      { v: "condo", t: "公寓", chip: "住公寓" },
      { v: "terrace", t: "排屋", chip: "住排屋" },
      { v: "bungalow", t: "半独立或独立洋房", chip: "住洋房" }
    ]},
    { id: "cook", q: "需要帮佣煮饭吗?", opts: [
      { v: "daily", t: "每天都要", chip: "每天煮饭" },
      { v: "some", t: "偶尔", chip: "偶尔煮饭" },
      { v: "no", t: "不用", chip: "不用煮饭" }
    ]}
  ]
};

var COMMON = [
  { id: "lang", q: "家人平时主要讲什么语言?", opts: [
    { v: "zh", t: "华语或方言", chip: "讲华语或方言" },
    { v: "en", t: "英语", chip: "讲英语" },
    { v: "ms", t: "马来语", chip: "讲马来语" },
    { v: "any", t: "都可以", chip: "语言都可以" }
  ]},
  { id: "home", q: "家里有养狗或煮猪肉吗?", hint: "有些帮佣因宗教或个人习惯不方便,先说清楚比较好。", opts: [
    { v: "dog", t: "有养狗", chip: "有养狗" },
    { v: "pork", t: "有煮猪肉", chip: "有煮猪肉" },
    { v: "both", t: "两样都有", chip: "有狗也有猪肉" },
    { v: "none", t: "都没有", chip: "没有狗和猪肉" }
  ]},
  { id: "time", q: "您大概什么时候需要帮佣?", opts: [
    { v: "asap", t: "越快越好", chip: "越快越好" },
    { v: "3m", t: "3 个月内", chip: "3 个月内" },
    { v: "later", t: "3 个月以后", chip: "3 个月以后" },
    { v: "look", t: "只是先了解", chip: "先了解" }
  ]}
];

var step = 0, picks = [];
var app = document.getElementById("app");

function questions() {
  var need = picks[0] && picks[0].v;
  return need ? [START].concat(FLOWS[need], COMMON) : [START];
}
function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function setHeader(h, s) {
  document.getElementById("headline").textContent = h;
  document.getElementById("subline").textContent = s;
}

function renderQuestion(moveFocus) {
  var q = questions()[step];
  app.textContent = "";
  var meta = el("div", "meta");
  if (step > 0) {
    var b = el("button", "back", "‹ 上一题");
    b.type = "button";
    b.onclick = function () { step--; picks.length = step; renderQuestion(true); };
    meta.appendChild(b);
  } else {
    meta.appendChild(el("span", "", "免费,不用填名字"));
  }
  meta.appendChild(el("span", "", "第 " + (step + 1) + " 题,共 " + TOTAL + " 题"));
  app.appendChild(meta);
  var bar = el("div", "bar"), fill = el("i");
  fill.style.width = ((step + 1) / TOTAL * 100) + "%";
  bar.appendChild(fill);
  app.appendChild(bar);
  var h = el("h2", "", q.q);
  h.tabIndex = -1;
  app.appendChild(h);
  if (q.hint) app.appendChild(el("p", "hint", q.hint));
  var list = el("div", "opts");
  q.opts.forEach(function (o) {
    var btn = el("button", "opt");
    btn.type = "button";
    var label = el("span", "", o.t);
    if (o.s) label.appendChild(el("small", "", o.s));
    btn.appendChild(label);
    btn.onclick = function () {
      picks[step] = o;
      if (step === 0) track("ViewContent", { content_name: "问卷开始", content_category: o.v });
      step++;
      if (step < TOTAL) renderQuestion(true); else renderReport();
    };
    list.appendChild(btn);
  });
  app.appendChild(list);
  if (moveFocus) { h.focus({ preventScroll: true }); window.scrollTo(0, 0); }
}

/* ---------- report logic ---------- */
var AXES = ["长辈照护", "小孩照顾", "煮饭", "打扫", "沟通"];

function answers() {
  var a = { need: picks[0].v, chips: [] };
  var qs = questions();
  picks.forEach(function (o, i) { a[qs[i].id] = o.v; if (o.chip) a.chips.push(o.chip); });
  a.chips.unshift({ elderly: "照顾长辈", child: "照顾小孩", house: "家务为主" }[a.need]);
  return a;
}

function scores(a) {
  var s = [0, 0, 2, 2, 1];
  if (a.need === "elderly") {
    s[0] = { A: 3, B: 4, C: 5 }[a.mob];
    if (a.health === "memory") { s[0] += 1; s[4] += 1; }
    if (a.health === "medical") s[0] = 5;
    s[4] += 1;
  } else if (a.need === "child") {
    s[1] = { baby: 5, small: 4, school: 2 }[a.age];
    if (a.adult === "none") s[1] += 1;
    if (a.age === "school") s[2] = 3;
  } else {
    s[3] = { condo: 3, terrace: 4, bungalow: 5 }[a.size];
    s[2] = { daily: 4, some: 2, no: 0 }[a.cook];
  }
  if (a.lang === "zh") s[4] += 1;
  return s.map(function (v) { return Math.max(0, Math.min(5, v)); });
}

function family(a) {
  var T = {
    elderly: {
      A: ["🌿", "温暖陪伴型家庭", "长辈还很有活力,最需要的是一个能陪伴聊天、细心照料日常的好帮手。"],
      B: ["🤝", "贴心扶持型家庭", "长辈行动需要人扶一把,帮佣的耐心和体力同样重要。"],
      C: ["🕯️", "全心照护型家庭", "这是一份需要爱心和体力的工作,也需要家人一起分担。"]
    },
    child: {
      baby: ["🍼", "新手宝贝型家庭", "宝宝的每一天都在长大,需要一位细心、作息稳定的照顾者。"],
      small: ["🎈", "活力成长型家庭", "小朋友精力满满,需要一位喜欢小孩、安全意识好的帮手。"],
      school: ["🎒", "学业接送型家庭", "孩子已经上学,重点是配合作息、把家里打点好。"]
    },
    house: {
      condo: ["🏙️", "精致小家型家庭", "空间不大但要求整齐,适合做事有条理的帮佣。"],
      terrace: ["🏠", "温馨多层型家庭", "上下楼打扫是日常,体力和效率都很重要。"],
      bungalow: ["🏡", "大屋管家型家庭", "大屋子需要一位勤快、懂得安排工作的管家型帮佣。"]
    }
  };
  var key = { elderly: a.mob, child: a.age, house: a.size }[a.need];
  return T[a.need][key];
}

function day(a) {
  var d = [];
  if (a.need === "elderly") {
    d.push(["7:00", "协助长辈起床、梳洗"]);
    d.push(["8:00", a.health === "meds" ? "准备早餐,提醒长辈吃药" : "准备早餐"]);
    d.push(["10:00", { A: "陪长辈散步、聊天", B: "扶长辈走动,做简单活动", C: "帮长辈翻身、擦身、换洗" }[a.mob]]);
    d.push(["12:00", "煮清淡的午餐"]);
    d.push(["13:00", "午休时间", true]);
    d.push(["15:00", "打扫家里、洗衣"]);
    d.push(["16:30", a.health === "memory" ? "陪长辈做简单活动,留意门窗安全" : "陪伴长辈,留意身体状况"]);
    d.push(["18:00", "煮晚餐"]);
    d.push(["20:00", "协助长辈洗澡、准备睡觉"]);
  } else if (a.need === "child") {
    if (a.age === "baby") {
      d.push(["7:00", "喂奶、换尿布"]); d.push(["9:00", "帮宝宝洗澡"]);
      d.push(["10:00", "消毒奶瓶、洗宝宝衣物"]); d.push(["12:00", "准备午餐"]);
      d.push(["13:00", "宝宝午睡,帮佣休息", true]); d.push(["15:00", "打扫家里"]);
      d.push(["17:00", "陪宝宝玩"]); d.push(["18:00", "准备晚餐"]); d.push(["20:00", "哄宝宝睡觉"]);
    } else if (a.age === "small") {
      d.push(["7:00", "准备早餐"]); d.push(["8:00", "陪小孩玩,或准备上幼儿园"]);
      d.push(["12:00", "准备午餐"]); d.push(["13:00", "小孩午睡时打扫"]);
      d.push(["14:30", "休息时间", true]); d.push(["16:00", "陪小孩玩、读故事"]);
      d.push(["18:00", "准备晚餐"]); d.push(["20:00", "帮小孩洗澡、哄睡"]);
    } else {
      d.push(["6:30", "准备早餐和便当"]); d.push(["9:00", "打扫家里、洗衣"]);
      d.push(["12:00", "准备午餐"]); d.push(["13:00", "休息时间", true]);
      d.push(["14:30", "迎接孩子放学"]); d.push(["16:00", "陪孩子做功课"]);
      d.push(["18:00", "准备晚餐"]); d.push(["20:00", "收拾家里"]);
    }
  } else {
    var multi = a.size !== "condo";
    if (a.cook !== "no") d.push(["7:00", "准备早餐"]);
    d.push(["8:00", "打扫客厅和厨房"]);
    d.push(["10:00", "洗衣、晾衣"]);
    if (a.cook === "daily") d.push(["12:00", "煮午餐"]);
    d.push(["13:00", "午休时间", true]);
    d.push(["14:30", multi ? "打扫各层楼的房间和浴室" : "打扫房间和浴室"]);
    d.push(["16:30", "烫衣服"]);
    if (a.cook !== "no") d.push(["18:00", "煮晚餐"]);
    d.push(["19:30", "收拾厨房"]);
  }
  return d;
}

function insights(a) {
  var r = [];
  if (a.need === "elderly" && a.mob === "C") r.push(["💪", "卧床照护很辛苦", "晚上的照顾最好由家人轮流分担,帮佣才不会累垮。"]);
  if (a.health === "memory") r.push(["🔐", "安全比什么都重要", "门窗、炉火和长辈外出,要事先和帮佣说好怎么处理。"]);
  if (a.health === "medical") r.push(["🩺", "帮佣不能取代护士", "打针、插管等医疗护理,要另外安排专业人员。"]);
  if (a.adult === "none") r.push(["📋", "白天只有帮佣和孩子在家", "把紧急联络人和突发情况的处理步骤写下来,贴在家里。"]);
  if (a.age === "baby") r.push(["👀", "头几周最关键", "最好有大人在旁边一起照顾,教她您家的方法。"]);
  if (a.size === "bungalow") r.push(["🧹", "大屋工作量不小", "可以考虑每周请钟点清洁,分担大扫除。"]);
  if (a.home === "dog" || a.home === "both") r.push(["🐕", "有狗,人选会明显变少", "要找能接受狗的帮佣,并说清楚要不要照顾狗。"]);
  if (a.home === "pork" || a.home === "both") r.push(["🍳", "先确认能否处理猪肉", "很多帮佣可以处理,只是自己不吃,面试时问清楚就好。"]);
  if (a.lang === "zh") r.push(["💬", "会华语的人选比较少", "可以用简单马来语、手势和翻译 App,一般几个月就熟悉了。"]);
  if (a.time === "asap") r.push(["⏱️", "新申请一般约需 3 个月", "您比较急,建议尽早联络我们,看看目前可以怎么安排。"]);
  r.push(["🌙", "每周给她一天休息", "休息够的帮佣做得更久、更稳定,对您家也更好。"]);
  return r.slice(0, 4);
}

function match(a) {
  var t, q;
  if (a.need === "elderly") {
    t = ["有耐心,尊重长辈", "细心,会留意身体变化",
      { A: "会煮清淡家常菜", B: "身体好,能稳当搀扶", C: "有照顾卧床长者的经验" }[a.mob]];
    q = ["以前照顾过的长辈是什么情况?每天怎么安排?", "长辈不肯吃药或发脾气时,你会怎么做?", "长辈突然跌倒,你第一步会做什么?"];
  } else if (a.need === "child") {
    t = ["喜欢小孩,有耐心", "安全意识好",
      { baby: "有带婴儿的经验", small: "有活力,会陪小孩玩", school: "做事可靠,能配合上学作息" }[a.age]];
    q = ["你照顾过几岁的小孩?", "小孩哭闹不停时,你会怎么做?", "小孩发烧时,你会怎么处理?"];
  } else {
    t = ["勤快,做事有条理", "爱干净,注意细节",
      a.cook === "daily" ? "会煮家常菜,愿意学您家的口味" : "体力好,效率高"];
    q = ["你一天的打扫顺序是怎样的?", "哪些衣服你会分开洗?", "以前做过多大的房子?"];
  }
  if (a.adult === "none") t[1] = "独立,遇到突发情况能冷静处理";
  return { traits: t, qs: q };
}

function workload(a, s) {
  var total = s.reduce(function (x, y) { return x + y; }, 0);
  var heavy = (a.mob === "C") || (a.size === "bungalow" && a.cook === "daily") || (a.age === "baby" && a.adult === "none");
  if (heavy || total >= 17) return { pct: 90, color: "var(--heavy)", label: "偏重", text: "这份工作对一位帮佣来说负担不轻。建议家人分担部分工作,或请钟点清洁帮忙,帮佣才能做得长久。" };
  if (total >= 13) return { pct: 60, color: "var(--warn)", label: "适中", text: "工作量合理。只要作息安排清楚、每周有休息,大部分有经验的帮佣都能胜任。" };
  return { pct: 32, color: "var(--ok)", label: "轻松", text: "工作量比较轻,适合第一次来马来西亚工作的帮佣慢慢学习。" };
}

function radarSVG(s) {
  var NS = "http://www.w3.org/2000/svg", cx = 160, cy = 122, R = 82;
  var svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 320 250");
  svg.setAttribute("class", "radar");
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", AXES.map(function (n, i) { return n + " " + s[i] + " 分"; }).join(","));
  function pt(i, r) { var ang = (-90 + 72 * i) * Math.PI / 180; return [cx + r * Math.cos(ang), cy + r * Math.sin(ang)]; }
  function poly(r) { return AXES.map(function (_, i) { return pt(i, r).join(","); }).join(" "); }
  for (var k = 1; k <= 5; k++) { var g = document.createElementNS(NS, "polygon"); g.setAttribute("points", poly(R * k / 5)); g.setAttribute("class", "grid"); svg.appendChild(g); }
  AXES.forEach(function (_, i) { var l = document.createElementNS(NS, "line"), p = pt(i, R); l.setAttribute("x1", cx); l.setAttribute("y1", cy); l.setAttribute("x2", p[0]); l.setAttribute("y2", p[1]); l.setAttribute("class", "grid"); svg.appendChild(l); });
  var area = document.createElementNS(NS, "polygon");
  area.setAttribute("points", s.map(function (v, i) { return pt(i, R * Math.max(v, .3) / 5).join(","); }).join(" "));
  area.setAttribute("class", "area");
  svg.appendChild(area);
  s.forEach(function (v, i) { var p = pt(i, R * Math.max(v, .3) / 5), c = document.createElementNS(NS, "circle"); c.setAttribute("cx", p[0]); c.setAttribute("cy", p[1]); c.setAttribute("r", 3.5); c.setAttribute("class", "dot"); svg.appendChild(c); });
  AXES.forEach(function (n, i) {
    var p = pt(i, R + 20), t = document.createElementNS(NS, "text");
    t.setAttribute("x", p[0]); t.setAttribute("y", p[1] + 4);
    t.setAttribute("text-anchor", Math.abs(p[0] - cx) < 10 ? "middle" : (p[0] > cx ? "start" : "end"));
    t.textContent = n + " " + s[i];
    svg.appendChild(t);
  });
  return svg;
}

function section(title, tag, lead) {
  var s = el("section", "sec"), h = el("h3", "", title);
  if (tag) h.appendChild(el("span", "", tag));
  s.appendChild(h);
  if (lead) s.appendChild(el("p", "lead", lead));
  app.appendChild(s);
  return s;
}

function renderReport() {
  var a = answers(), s = scores(a), fam = family(a), m = match(a), w = workload(a, s);

  badge.appendChild(el("p", "", fam[2]));
  var chips = el("ul", "chips");

  var s3 = section("你可能没想到的事");
  var ins = el("ul", "ins");
  insights(a).forEach(function (r) { var li = el("li"); li.appendChild(el("i", "", r[0])); var d = el("div"); d.appendChild(el("b", "", r[1])); d.appendChild(el("span", "", r[2])); li.appendChild(d); ins.appendChild(li); });
  s3.appendChild(ins);

  var s4 = section("最适合你家的帮佣");
  var tr = el("div", "traits");
  m.traits.forEach(function (t) { tr.appendChild(el("div", "", t)); });
  s4.appendChild(tr);
  s4.appendChild(el("p", "qtitle", "面试时可以问她:"));
  var ol = el("ol", "qs");
  m.qs.forEach(function (q) { ol.appendChild(el("li", "", q)); });
  s4.appendChild(ol);

  var s5 = section("工作量检查");
  s5.appendChild(el("p", "verdict", "工作量:" + w.label));
  var mt = el("div", "meter"), mi = el("i"); mi.style.width = w.pct + "%"; mi.style.background = w.color; mt.appendChild(mi); s5.appendChild(mt);
  var ld = el("div", "load"); ["轻松", "适中", "偏重"].forEach(function (t) { ld.appendChild(el("span", "", t)); }); s5.appendChild(ld);
  s5.appendChild(el("p", "", w.text));

  var label = el("label", "extra", "还有什么想补充?(可不填)");
  label.htmlFor = "extra";
  var box = el("textarea"); box.id = "extra"; box.maxLength = 300; box.placeholder = "例如:长辈 82 岁,婆婆,住一楼";
  label.appendChild(box);
  app.appendChild(label);

  track("CompleteRegistration", { content_name: "AI 帮佣报告" });
  var link = el("a", "cta", "发送报告,获取 AI 配对人选");
  function updateLink() {
    var msg = "您好 Maju One,我做了 AI 帮佣报告,请帮我配对。\n家庭类型:" + fam[1] + "\n我的情况:" + a.chips.join("、") + "\n工作量:" + w.label;
    var more = box.value.trim();
    if (more) msg += "\n补充:" + more;
    link.href = "https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(msg);
  }
  box.addEventListener("input", updateLink);
  updateLink();
  link.target = "_blank"; link.rel = "noopener";
  link.addEventListener("click", function () { track("Contact"); track("Lead", { content_name: "WhatsApp 报告" }); });
  app.appendChild(link);
  app.appendChild(el("p", "sub", "WhatsApp:018-989 1966 · 电话:018-577 1089"));

  var again = el("button", "again", "重新选择");
  again.type = "button";
  again.onclick = function () { step = 0; picks = []; setHeader("不看八字,看你家的需要", "点选 6 题,马上看到你家的 AI 帮佣报告。"); renderQuestion(true); };
  app.appendChild(again);
  app.appendChild(el("p", "note", "报告仅供参考,实际人选以当时可安排的情况为准。您的选择不会被保存,只有按下 WhatsApp 并发送后,我们才会收到。"));
  h.focus({ preventScroll: true });
  window.scrollTo(0, 0);
}

renderQuestion(false);
